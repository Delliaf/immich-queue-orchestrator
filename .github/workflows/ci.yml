name: CI

on:
  push:
    branches-ignore: [dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: immich-queue-orchestrator:ci
      - name: Verify writable state volume
        shell: bash
        run: |
          volume="immich-queue-orchestrator-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker volume create "$volume"
          trap 'docker volume rm -f "$volume"' EXIT
          docker run --rm \
            --read-only \
            --cap-drop=ALL \
            --security-opt no-new-privileges=true \
            --mount "type=volume,source=$volume,target=/data" \
            --entrypoint node \
            immich-queue-orchestrator:ci \
            -e "require('node:fs').writeFileSync('/data/ci-write-probe', 'ok')"
