# Merge this service and named volume into the existing Immich compose file.
# It intentionally depends on that file's immich-server service.
services:
  immich-queue-orchestrator:
    container_name: immich_queue_orchestrator
    image: ghcr.io/delliaf/immich-queue-orchestrator:latest
    env_file:
      - .env
    ports:
      - "8005:8005"
    volumes:
      - immich_queue_orchestrator_data:/data
    depends_on:
      - immich-server
    restart: unless-stopped

volumes:
  immich_queue_orchestrator_data:
