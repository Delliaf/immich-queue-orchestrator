version: 1

# First start: keep dryRun=true. The service will observe Immich but reject mutations.
mode: autopilot
dryRun: true

control:
  enabled: true
  resumePersistedRun: true
  newInstallAction: wait

api:
  url: http://immich-server:2283/api
  timeout: 10s
  # Enable only after queued-only operation is verified on your server.
  allowLegacyStart: false
  strictMajorVersion: true
  supportedMajorVersions: [3]

server:
  host: 0.0.0.0
  port: 8005
  trustProxy: false
  authentication: auto

scheduler:
  managedQueues:
    - metadataExtraction
    - storageTemplateMigration
    - thumbnailGeneration
    - smartSearch
    - duplicateDetection
    - faceDetection
    - facialRecognition
    - ocr
    - videoConversion
  pollInterval: 5s
  # Autopilot checks for new uploads every 10s while all managed queues are guarded.
  # Values of 30s or more are rejected so upload detection stays below 30 seconds.
  guardedIdlePollInterval: 10s
  standbyPollInterval: 30s
  startSettlePeriod: 10s
  quietPeriod: 30s
  revisitPolicy: finish-pass

capture:
  uploadQuietPeriod: 60s
  processingPolicy: drain-first-repair-second

autopilot:
  available: true
  autoEndAfter: 30m
  minimumCaptureTime: 1m
  newUploadDuringProcessing: pause-after-active-and-recapture

loadGuard:
  mode: observe
  source: local-host
  sampleInterval: 2s
  movingAverageWindow: 30s
  # For opt-in throttling, set mode=throttle and both thresholds.
  pauseAbove: null
  pauseFor: 30s
  resumeBelow: null
  resumeFor: 60s

recovery:
  startupPolicy: reconcile
  idlePolicy: restore-original
  manualOverridePolicy: stop-controller
  ambiguousStartPolicy: require-operator

pipeline:
  - id: metadata
    queue: metadataExtraction
    dependsOn: []
    startMissing: true
    resourceGroup: cpu-io

  - id: storage
    queue: storageTemplateMigration
    dependsOn: [metadata]
    startMissing: false
    resourceGroup: io

  - id: thumbnails
    queue: thumbnailGeneration
    dependsOn: [storage]
    startMissing: true
    resourceGroup: cpu-io

  - id: smart-search
    queue: smartSearch
    dependsOn: [thumbnails]
    startMissing: true
    resourceGroup: ml-text
    feature: smartSearch

  - id: duplicates
    queue: duplicateDetection
    dependsOn: [smart-search]
    startMissing: true
    resourceGroup: ml-text
    feature: duplicateDetection

  - id: face-detection
    queue: faceDetection
    dependsOn: [thumbnails]
    startMissing: true
    resourceGroup: ml-vision
    feature: facialRecognition

  - id: facial-recognition
    queue: facialRecognition
    dependsOn: [face-detection]
    startMissing: true
    resourceGroup: ml-vision
    feature: facialRecognition

  - id: ocr
    queue: ocr
    dependsOn: [thumbnails]
    startMissing: true
    resourceGroup: ml-text
    feature: ocr

  - id: video
    queue: videoConversion
    dependsOn: [metadata, thumbnails]
    startMissing: true
    resourceGroup: video
